# Review existing ingress, free port 4311 and DNS before enabling.
# This HTTP vhost is an ACME/bootstrap template. Add a valid TLS certificate
# for commerce.netcuriontechnology.com before enabling accounts or payments.
server {
    listen 80;
    server_name commerce.netcuriontechnology.com;
    client_max_body_size 300k;
    location / {
        proxy_pass http://127.0.0.1:4311;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 45s;
    }
}
# Never expose port 4311 publicly. Do not replace other server blocks.
# Custom merchant domains need their own validated TLS ingress routing
# to this service; the application does not issue certificates itself.
