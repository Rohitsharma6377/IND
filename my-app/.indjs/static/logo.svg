<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="50%" style="stop-color:#a5b4fc"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Hexagon Frame -->
  <path d="M100 15 L175 55 L175 145 L100 185 L25 145 L25 55 Z" 
        fill="none" 
        stroke="url(#hexGradient)" 
        stroke-width="12"
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- Inner glow effect -->
  <path d="M100 25 L165 60 L165 140 L100 175 L35 140 L35 60 Z" 
        fill="none" 
        stroke="url(#hexGradient)" 
        stroke-width="3"
        stroke-linejoin="round"
        opacity="0.3"/>
  
  <!-- Text "indjs" -->
  <text x="100" y="115" 
        font-family="Arial, sans-serif" 
        font-size="38" 
        font-weight="600"
        fill="url(#textGradient)"
        text-anchor="middle"
        filter="url(#glow)">indjs</text>
  
  <!-- Small decorative dot -->
  <circle cx="165" cy="155" r="8" fill="url(#hexGradient)" opacity="0.8"/>
</svg>
